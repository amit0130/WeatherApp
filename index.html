<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="weather.css">
</head>
<body>
    <div class="container">
        <h1>Weather App</h1>
        <div class="input-container">
            <input type="text" id="input-text" placeholder="Enter city name">
            <button id="weather-btn">Get weather</button>
        </div>
        <div id="weather-info" class="hidden">
            <div class="city-header">
            <h2 id="city-name"></h2>
            <img id="country-flag" src="" alt="Country Flag" width="40" />
            </div>
            <p id="temperature"></p>
            <p id="description"></p>
            <img id="weather-icon" src="" alt="Weather Icon" width="80" />
        </div>
        <p id="error-message" class="hidden">City could not found, please enter valid city</p>
    </div>

    <script src="weather.js" ></script>
</body>
</html>
